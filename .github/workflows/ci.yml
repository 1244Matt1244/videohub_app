name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore backend/VideoApp.sln
      - run: dotnet build backend/VideoApp.sln --no-restore -c Release
      - run: dotnet test backend/VideoApp.Tests/VideoApp.Tests.csproj --no-build -c Release

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd frontend && npm install
      - run: cd frontend && npm run build
