services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: videoapp-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
      MSSQL_MEMORY_LIMIT_MB: "1536"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
      - ./backend/Database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./backend/Database/entrypoint.sh:/entrypoint.sh
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -C -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s

  backend:
    build:
      context: ./backend/VideoApp
      dockerfile: Dockerfile
    container_name: videoapp-api
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Server=db;Database=VideoApp;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;"
      Jwt__Key: "CHANGE_THIS_SUPER_LONG_SECRET_KEY_MIN_32_CHARS_1234567890"
      Jwt__Issuer: "VideoApp"
      Jwt__Audience: "VideoAppClient"
      Jwt__ExpirationMinutes: "60"
      Mux__TokenId: "${MUX_TOKEN_ID}"
      Mux__TokenSecret: "${MUX_TOKEN_SECRET}"
      Stripe__SecretKey: "${STRIPE_SECRET_KEY}"
      Stripe__WebhookSecret: "${STRIPE_WEBHOOK_SECRET}"
      Google__ClientId: "${GOOGLE_CLIENT_ID}"
      Google__ClientSecret: "${GOOGLE_CLIENT_SECRET}"
      Frontend__Url: "http://localhost:3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: videoapp-web
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NUXT_PUBLIC_API_BASE: "http://localhost:5000"

volumes:
  sql_data:
